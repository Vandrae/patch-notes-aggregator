# Optional: a local MySQL for `--spring.profiles.active=mysql`
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: patchnotes
      MYSQL_USER: patchnotes
      MYSQL_PASSWORD: patchnotes
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
