# Production settings: add with SPRING_PROFILES_ACTIVE=prod (compose.prod.yaml uses "prod,mysql").
# They sit on top of application.yml, and the app refuses to start if a setting that must be present is missing:
#   - JWT_SECRET (32+ characters) must be set, see SecurityConfig
#   - PUBLIC_BASE_URL must be an https address (http://localhost is allowed for trying this profile locally),
#     see ProductionSettingsCheck

server:
  # Stop accepting new requests on shutdown, but let running ones finish.
  shutdown: graceful
  # Behind a reverse proxy that terminates TLS (Caddy, in compose.prod.yaml), believe its X-Forwarded-* headers, so the app
  # knows the request was https (that is what makes Strict-Transport-Security be sent) and who the visitor really is (that
  # is what the rate limits are keyed on). "native" is Tomcat's own handling: it only believes those headers when the
  # connection comes from a private-network address (loopback, 10/8, 172.16/12, 192.168/16: the proxy on the Docker network
  # or in the same VPC) and reads the visitor from the right of X-Forwarded-For, where only the proxy writes, so a header a
  # visitor sends cannot choose their own address. A connection from anywhere else has its headers ignored. Even so, never
  # publish the app's own port: anything that reaches it from a private address is believed. Set
  # FORWARD_HEADERS_STRATEGY=none when nothing sits in front of the app.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:native}
  # Error responses never carry exception messages, stack traces or validation details.
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false
  compression:
    enabled: true

spring:
  lifecycle:
    # how long a graceful shutdown waits for in-flight work
    timeout-per-shutdown-phase: 30s
  task:
    scheduling:
      shutdown:
        # let a running poll or sync tick finish (or notice the interrupt) instead of cutting it off mid-write
        await-termination: true
        await-termination-period: 30s
  jpa:
    show-sql: false

management:
  endpoint:
    health:
      show-details: never
  endpoints:
    web:
      exposure:
        include: health   # nothing else is reachable over HTTP; metrics are registered but not exposed

logging:
  level:
    root: INFO
