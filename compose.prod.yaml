# The whole app as containers: Caddy (the https front door), the Patch Notes app, and its MySQL database.
#
#   cp .env.example .env      # then fill in the secrets (compose reads .env automatically)
#   docker compose -f compose.prod.yaml up -d --build
#   docker compose -f compose.prod.yaml logs -f app
#
# Only Caddy publishes ports (80 and 443). The app and the database are reachable only on the private compose network,
# so every visitor comes through Caddy, which is what makes the visitor's address (and so the rate limits) trustworthy.
# Memory limits are sized for a 2 GB machine (an EC2 t3.small): about 0.8 GB for the app, 0.5 GB for the database and
# 0.1 GB for Caddy, which leaves the rest for the operating system.
#
# (compose.yaml, next to this file, is the development one: just a MySQL with its port open on your machine.)
#
# A value written ${NAME:?message} makes compose REFUSE TO START with that message when NAME is unset, so a deployment
# can never silently come up without a database password or a session-signing key.

# Without a limit Docker keeps every container's log forever, and the poller writes all day: on a small disk that is a slow
# way to run out of space. This keeps the newest 30 MB of log per container (three files of 10 MB, oldest dropped first).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 512m
    # Trimmed to fit a small machine: a 128 MB cache for table data and no performance schema (which alone would take a
    # few hundred MB), and room for 50 connections, far more than the app's pool ever opens.
    command: ["--innodb-buffer-pool-size=128M", "--performance-schema=OFF", "--max-connections=50"]
    environment:
      MYSQL_DATABASE: patchnotes
      MYSQL_USER: patchnotes
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      # a named volume: the data survives `docker compose down` and container re-creation (use `down -v` to wipe it)
      - mysql-data:/var/lib/mysql
    # no `ports:` here on purpose: only the app container, on the private compose network, can reach the database
    healthcheck:
      # $$ stops compose from substituting the variable itself, so the shell INSIDE the container expands it
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  app:
    build: .
    # the name the built image gets; CI builds and tags it first, then runs compose with --no-build
    image: ${APP_IMAGE:-patch-notes-aggregator:local}
    restart: unless-stopped
    logging: *default-logging
    # the JVM sizes its heap as 75% of this (see the Dockerfile), the rest is for its own overhead
    mem_limit: 800m
    depends_on:
      mysql:
        condition: service_healthy   # wait until MySQL answers, not merely until its container exists
    environment:
      # prod: security and shutdown settings for production (see application-prod.yml); mysql: the database
      SPRING_PROFILES_ACTIVE: prod,mysql
      # Caddy is in front, so believe its X-Forwarded-* headers (only from private-network addresses, see
      # application-prod.yml). Never publish this container's port: then anything could claim to be a proxy.
      FORWARD_HEADERS_STRATEGY: native
      MYSQL_URL: jdbc:mysql://mysql:3306/patchnotes?rewriteBatchedStatements=true   # "mysql" = the service name above
      MYSQL_USER: patchnotes
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (32+ characters)}
      STEAM_API_KEY: ${STEAM_API_KEY:-}
      # where browsers reach the app; Steam sends people back here after login. The prod profile REFUSES to start unless
      # this is an https address (https://localhost is Caddy's own certificate on your machine), and https also turns on
      # the Secure flag for the session cookie. With a real domain set PUBLIC_BASE_URL=https://<DOMAIN> in .env.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://localhost}
    # `expose` only documents the port for other containers; unlike `ports` it opens nothing on the host
    expose:
      - "8080"

  caddy:
    image: caddy:2
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 128m
    depends_on:
      app:
        condition: service_healthy   # the app's own health check (from the Dockerfile)
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"     # also needed for the certificate challenge and to redirect http to https
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # the certificates: keep them, or every restart asks Let's Encrypt for new ones and hits its rate limits
      - caddy-data:/data
      - caddy-config:/config

volumes:
  mysql-data:
  caddy-data:
  caddy-config:
